[project]
name = "agent-smith-moulinette"
version = "1.1.0"
description = "Agent Smith - evaluation harness (moulinette)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.6",
]

[project.scripts]
moulinette_eval = "moulinette_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moulinette_eval"]

[tool.hatch.build.targets.wheel.force-include]
"moulinette_eval/fixtures" = "moulinette_eval/fixtures"
