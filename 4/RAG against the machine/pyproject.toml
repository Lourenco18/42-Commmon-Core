[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "student"
version = "0.1.0"
description = "RAG against the machine - 42 School Project"
requires-python = ">=3.10"
dependencies = [
    "fire>=0.6.0",
    "pydantic>=2.0.0",
    "rank-bm25>=0.2.2",
    "tqdm>=4.66.0",
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "flake8>=7.0.0",
    "mypy>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/student"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
